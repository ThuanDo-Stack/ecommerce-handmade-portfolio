services:
  db:
    image: postgres:15-alpine
    container_name: handmade_db
    environment:
      POSTGRES_DB: ecommerce_handmade_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: handmade_backend
    environment:
      # Cấu hình để kết nối tới DB container
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ecommerce_handmade_dev
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=123456
      # Cấu hình frontend URL (để CORS và VNPAY return redirect)
      - APP_FRONTEND_URL=http://localhost:3000
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: handmade_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
